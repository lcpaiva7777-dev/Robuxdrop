<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RobuxDrop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
main{max-width:520px;margin:auto;padding:30px 18px}.logo{text-align:center;font-size:30px;font-weight:900;margin-bottom:28px}.logo span{color:#00e676}
.card{background:#171d2d;border:1px solid #2b3549;border-radius:22px;padding:22px}
h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#aab4c6;margin-bottom:24px}
.row{display:flex;gap:9px}input{flex:1;min-width:0;background:#0d1422;border:1px solid #354158;border-radius:13px;color:#fff;padding:15px;font-size:16px;outline:0}
button{border:0;border-radius:13px;background:#00e676;font-weight:900;padding:0 18px;cursor:pointer}button:disabled{opacity:.6}
#msg{min-height:20px;color:#aab4c6;margin:10px 0;font-size:13px}
.profile{display:none;background:#0d1422;border:1px solid #29354b;border-radius:18px;padding:16px;margin-top:14px}
.profile img{width:220px;height:220px;object-fit:contain;display:block;margin:auto}
.name{text-align:center;font-size:20px;font-weight:900;margin-top:5px}.id{text-align:center;color:#00e676;margin-top:6px;font-size:14px}
</style>
</head>
<body><main>
<div class="logo">ROBux<span>DROP</span></div>
<section class="card">
<h1>Consultar jogador</h1>
<div class="sub">Digite o nome exato do usuário do Roblox.</div>
<div class="row"><input id="username" placeholder="Ex.: Builderman" autocomplete="off"><button id="btn">Buscar</button></div>
<div id="msg"></div>
<div class="profile" id="profile">
<img id="avatar" alt="Avatar Roblox">
<div class="name" id="name"></div><div class="id" id="id"></div>
</div>
</section></main>
<script>
const $=x=>document.getElementById(x),btn=$("btn");
async function buscar(){
 const nick=$("username").value.trim();$("profile").style.display="none";
 if(!nick){$("msg").textContent="Digite um nome de usuário.";return}
 btn.disabled=true;btn.textContent="Buscando...";$("msg").textContent="Consultando...";
 try{
   const r=await fetch("/api/roblox?username="+encodeURIComponent(nick));
   const data=await r.json();
   if(!r.ok) throw new Error(data.error||"Erro");
   $("avatar").src=data.avatar;
   $("name").textContent="@"+data.username;
   $("id").textContent="ID: "+data.id;
   $("profile").style.display="block";$("msg").textContent="Usuário encontrado.";
 }catch(e){$("msg").textContent=e.message==="NOT_FOUND"?"Usuário não encontrado.":"Não foi possível consultar o Roblox agora."}
 finally{btn.disabled=false;btn.textContent="Buscar"}
}
btn.onclick=buscar;$("username").onkeydown=e=>{if(e.key==="Enter")buscar()};
</script></body></html>
